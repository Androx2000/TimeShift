<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeShift · Workforce Management Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brandBlue: "#1e3a8a",
                        textDark: "#111827",
                        textGray: "#6b7280"
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bouncy-btn { transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .bouncy-btn:active { transform: scale(0.97); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased">

    <main class="w-full max-w-[420px] p-3 sm:p-4 mx-auto">
        <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-10 flex flex-col items-center">
            
            <h1 class="text-3xl sm:text-4xl font-black text-brandBlue mb-1 tracking-tight">TimeShift</h1>
            <p class="text-xs sm:text-sm font-medium text-textGray mb-6 sm:mb-8 text-center">Portal de Gestión y Asistencia</p>
            
            <form id="login-form" class="w-full space-y-4 sm:space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Usuario</label>
                    <input type="text" id="username" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-brandBlue focus:border-brandBlue transition-shadow" placeholder="Username" required>
                </div>
                
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-brandBlue focus:border-brandBlue transition-shadow pr-10" placeholder="••••••••" required>
                        <button type="button" id="toggle-pwd" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors p-1" aria-label="Mostrar u ocultar contraseña">
                            <!-- Tabler Eye Off Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye-off" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" />
                                <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" />
                                <path d="M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="login-error" class="hidden text-xs text-red-600 font-medium text-center bg-red-50 p-2.5 rounded-lg border border-red-200"></div>

                <button type="submit" class="bouncy-btn w-full bg-brandBlue hover:bg-blue-900 text-white font-semibold text-sm py-3 rounded-lg transition-colors mt-2 shadow-sm min-h-[44px] flex items-center justify-center">
                    Iniciar Sesión
                </button>
            </form>

            <p class="text-xs text-slate-500 text-center mt-6 leading-relaxed">
                ¿Olvidó su contraseña o tiene problemas para ingresar?<br>
                <a href="#" class="text-brandBlue hover:underline font-semibold">Contacte a soporte técnico.</a>
            </p>

            <div class="w-full flex justify-between items-center text-[10px] text-slate-400 font-medium mt-8 pt-4 border-t border-slate-100">
                <span>Versión 1.0</span>
                <span>TimeShift hecho por DAW UDB.</span>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const errorDiv = document.getElementById('login-error');
            const togglePwd = document.getElementById('toggle-pwd');
            const pwdInput = document.getElementById('password');

            // Toggle password visibility
            togglePwd.addEventListener('click', () => {
                const isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                togglePwd.innerHTML = isPassword ? 
                    `<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /></svg>` 
                    : 
                    `<svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-eye-off" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" /><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" /><path d="M3 3l18 18" /></svg>`;
            });

            // --- AUTO-CLEAR LEGACY MOCK DATA ---
            const currentEmployees = localStorage.getItem('ts_employees');
            if (currentEmployees && currentEmployees.includes('Jovita Alvarado') && currentEmployees.includes('cgerente@timeshift.com')) {
                // If it detects the old 9 default seeded mock users, wipe the DB to start fresh!
                localStorage.removeItem('ts_employees');
                localStorage.removeItem('ts_punches');
            }
            // Clear current session just in case
            // Limpiar credenciales de sesión activa anterior al cargar el login
            sessionStorage.clear();
            localStorage.removeItem('ts_user');
            localStorage.removeItem('ts_role');
            localStorage.removeItem('ts_cargo');
            localStorage.removeItem('ts_name');
            localStorage.removeItem('timeshift_session');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const btn = form.querySelector('button[type="submit"]');
                
                // Animate button bounce
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = 'scale(1)', 150);

                // Base de datos simulada de credenciales para la defensa
                const validUsers = [
                    { username: 'jalvarado', password: 'Jovita2026', role: 'admin', cargo: 'Dueña', name: 'Jovita Alvarado' },
                    { username: 'cgerente', password: 'Gerente2026', role: 'admin', cargo: 'Gerente', name: 'Carlos Guevara' },
                    { username: 'aruiz', password: 'Operativo1', role: 'empleado', cargo: 'Abogada Litigante', name: 'Andrea Ruiz' },
                    { username: 'mportillo', password: 'Operativo2', role: 'empleado', cargo: 'Abogada Corporativa', name: 'Marcela Portillo' },
                    { username: 'jhenriquez', password: 'Operativo3', role: 'empleado', cargo: 'Asistente Legal', name: 'Javier Henríquez' },
                    { username: 'lcastro', password: 'Operativo4', role: 'empleado', cargo: 'Asistente Legal', name: 'Luis Castro' },
                    { username: 'rflores', password: 'Operativo5', role: 'empleado', cargo: 'Recepción', name: 'Roxana Flores' },
                    { username: 'ppineda', password: 'Operativo6', role: 'empleado', cargo: 'Contabilidad', name: 'Patricia Pineda' },
                    { username: 'esantos', password: 'Operativo7', role: 'empleado', cargo: 'Mensajería / Notificador', name: 'Eduardo Santos' }
                ];

                const user = validUsers.find(u => u.username === username && u.password === password);

                if (user) {
                    // Guardamos sesión activa en sessionStorage y localStorage
                    sessionStorage.setItem('ts_user', user.username);
                    sessionStorage.setItem('ts_role', user.role);
                    sessionStorage.setItem('ts_cargo', user.cargo);
                    sessionStorage.setItem('ts_name', user.name);

                    localStorage.setItem('ts_user', user.username);
                    localStorage.setItem('ts_role', user.role);
                    localStorage.setItem('ts_cargo', user.cargo);
                    localStorage.setItem('ts_name', user.name);
                    
                    // Enrutamiento según el rol
                    window.location.href = user.role === 'admin' ? 'dashboard.html' : 'portal.html';
                } else {
                    errorDiv.textContent = 'Credenciales inválidas. Por favor verifique e intente de nuevo.';
                    errorDiv.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
