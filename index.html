<!DOCTYPE html>
<html lang="es-SV">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso al sistema TimeShift de la Oficina Jurídica Jovita Alvarado.">
  <title>TimeShift · Iniciar sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tinta:     '#14202B',
            tintaAlta: '#1D2D3B',
            borde:     '#2C4054',
            pergamino: '#F2EDE4',
            lienzo:    '#FFFFFF',
            tenue:     '#9FB0BF',
            grafito:   '#5C6B78',
            laton:     '#C89B3C',
            fallo:     '#B4553F',
            acuerdo:   '#4F8A6B'
          },
          fontFamily: {
            titular: ['"Source Serif 4"', 'Georgia', 'serif'],
            base:    ['"IBM Plex Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="min-h-screen bg-pergamino font-base text-tinta antialiased">

  <main class="flex min-h-screen items-center justify-center px-6 py-12 sm:px-10">
    <div class="w-full max-w-sm">

      <div class="mb-8 text-center">
        <p class="font-titular text-2xl text-tinta">TimeShift</p>
        <p class="text-sm text-grafito">Oficina Jurídica Jovita Alvarado</p>
      </div>

      <div class="rounded-2xl bg-lienzo p-8 shadow-[0_1px_2px_rgba(20,32,43,0.06),0_12px_32px_rgba(20,32,43,0.08)] ring-1 ring-black/5">

        <h1 class="font-titular text-2xl text-tinta">Iniciar sesión</h1>
        <p class="mt-1 text-sm text-grafito">Ingrese sus credenciales para continuar.</p>

        <!-- Selector de rol -->
        <div class="mt-6">
          <span class="block text-sm text-grafito" id="rol-etiqueta">Ingresa como</span>
          <div role="radiogroup" aria-labelledby="rol-etiqueta"
               class="mt-2 grid grid-cols-2 gap-1 rounded-lg bg-pergamino p-1">
            <button type="button" data-rol="trabajador"
                    role="radio" aria-checked="true"
                    class="rol-tecla rol-tecla-activa rounded-md px-3 py-2 text-sm font-medium transition">
              Trabajador
            </button>
            <button type="button" data-rol="admin"
                    role="radio" aria-checked="false"
                    class="rol-tecla rounded-md px-3 py-2 text-sm font-medium text-grafito transition">
              Administrador
            </button>
          </div>
        </div>

        <form id="form-login" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="usuario" class="block text-sm text-grafito">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required
                   placeholder="nombre.apellido"
                   class="campo mt-1 w-full rounded-lg border border-black/10 bg-lienzo px-3 py-2.5 text-tinta placeholder:text-grafito/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-laton">
          </div>

            <div>
              <div class="flex items-center justify-between">
                <label for="clave" class="block text-sm text-grafito">Contraseña</label>
                <a href="#" class="text-xs text-grafito underline decoration-black/20 underline-offset-2 hover:text-laton">
                  ¿Olvidó su contraseña?
                </a>
              </div>
              <div class="relative mt-1">
                <input id="clave" name="clave" type="password" autocomplete="current-password" required
                       placeholder="••••••••"
                       class="campo w-full rounded-lg border border-black/10 bg-lienzo px-3 py-2.5 pr-11 text-tinta placeholder:text-grafito/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-laton">
                <button type="button" id="alternar-clave"
                        class="absolute inset-y-0 right-0 flex w-10 items-center justify-center text-grafito hover:text-tinta"
                        aria-label="Mostrar contraseña" aria-pressed="false">
                  <svg id="icono-ojo" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

            <p id="mensaje-login" role="alert"
               class="hidden rounded-lg border border-fallo/30 bg-fallo/10 px-3 py-2 text-sm text-fallo">
              Usuario o contraseña incorrectos.
            </p>

            <button type="submit"
                    class="w-full rounded-lg bg-tinta py-2.5 text-sm font-medium text-pergamino transition hover:bg-tintaAlta focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-laton">
              Iniciar sesión
            </button>
        </form>
      </div>

    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
