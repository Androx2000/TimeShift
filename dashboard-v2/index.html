
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TimeShift | Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <main class="dashboard">
    <header>
      <h1>TimeShift</h1>
      <p>Panel de monitoreo de empleados</p>
    </header>

    <section class="stats">
      <article class="card">
        <h2>Disponible</h2>
        <p id="available-count">0</p>
      </article>

      <article class="card">
        <h2>Lunch</h2>
        <p id="lunch-count">0</p>
      </article>

      <article class="card">
        <h2>Break</h2>
        <p id="break-count">0</p>
      </article>

      <article class="card">
        <h2>Salida</h2>
        <p id="end-count">0</p>
      </article>
    </section>
  </main>
</body>
</html>
